<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Customer</title>
    <link rel="stylesheet" href="create-customer.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <nav>
          <ul>
            <li>
              <a href="../dashboard/dashboard.html"
                ><img
                  src="../assets/icons/home_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
                  alt=""
                />Home</a
              >
            </li>
            <li>
              <a href="#"
                ><img
                  src="../assets/icons/check_circle_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
                  alt=""
                />Tasks</a
              >
            </li>
            <li>
              <a href="../customers/customers.html"
                ><img
                  src="../assets/icons/groups_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
                  alt=""
                />Customers</a
              >
            </li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <h1>Create a customer</h1>
        <hr />
        <form class="customer-form">
          <div class="form-field">
            <label for="customer-name">Contact Name</label>
            <input type="text" id="customer-name" />
          </div>

          <div class="form-field">
            <label class="company-name">Company Name</label>
            <input type="text" id="company-name" required />
          </div>

          <div class="form-field">
            <label class="customer-email">Contact Email</label>
            <input type="email" id="customer-email" />
          </div>

          <div class="form-field">
            <label class="customer-phone">Contact Phone #</label>
            <input type="tel" id="customer-phone" />
          </div>

          <div class="form-field">
            <label class="job-title">Contact Job Title</label>
            <input type="text" id="job-title" />
          </div>

          <div class="form-field">
            <label class="company-address">Company Address</label>
            <input type="text" id="company-address" />
          </div>

          <div class="address-row">
            <div class="form-field">
              <label class="company-city">Company City</label>
              <input type="text" id="company-city" />
            </div>

            <div class="form-field">
              <label class="company-state">Company State</label>
              <input type="text" id="company-state" />
            </div>

            <div class="form-field">
              <label class="company-zip">Company Zip</label>
              <input type="text" id="company-zip" />
            </div>
          </div>

          <button class="create-a-customer" type="submit">
            Create Customer
          </button>
        </form>
      </main>
    </div>
    <script src="create-customer.js"></script>
  </body>
</html>
