<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<h3>Login or Create Account</h3>
    <section class="login-section">
        <form class="login-form">
            <input class="email-input" type="email" placeholder="Email" required>
            <input class="password-input" type="password" placeholder="Password" required>
            <button class="login-button" type="submit">Login</button>
            <button class="create-account-button" type="button">Create Account</button>
        </form>
    </section>

    <script src="login.js"></script>
</body>
</html>
